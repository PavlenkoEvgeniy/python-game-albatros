name: Build

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS packaging is deferred until its CI build is stable.
        os: [ubuntu-latest, windows-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests
        run: uv run pytest -q

      - name: Read version and check tag
        id: version
        shell: bash
        run: |
          version=$(uv run python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$version" >&2
            exit 1
          fi

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build Linux app and packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          uv run pyinstaller --onefile --windowed --noconfirm --clean \
            --name Albatross-linux \
            --icon=packaging/icons/albatross.png \
            --collect-all pygame \
            --copy-metadata albatross \
            main.py
          dist/Albatross-linux --version
          bash packaging/linux/build_packages.sh \
            "${{ steps.version.outputs.value }}" \
            "dist/Albatross-linux" \
            "dist/installers"

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows app and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run pyinstaller --onefile --windowed --noconfirm --clean `
            --name Albatross-windows `
            --icon=packaging/icons/albatross.ico `
            --collect-all pygame `
            --copy-metadata albatross `
            main.py
          $smoke = Start-Process -FilePath "dist\Albatross-windows.exe" -ArgumentList "--version" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" `
            "/DRepoRoot=$env:GITHUB_WORKSPACE" `
            "/DSourceExe=$env:GITHUB_WORKSPACE\dist\Albatross-windows.exe" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\dist\installers" `
            "packaging\windows\albatross.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Albatross-${{ runner.os }}
          path: dist/installers/*
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Albatross-Linux/*.deb
            artifacts/Albatross-Linux/*.rpm
            artifacts/Albatross-Windows/*setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
